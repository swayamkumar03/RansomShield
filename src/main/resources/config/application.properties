# RansomShield Configuration
# Real-Time Behavioral Ransomware Detection System

# Monitoring Configuration
monitoring.default-directory=./test-data
monitoring.test-directory=./test-data
monitoring.recursive=true
monitoring.queue-capacity=5000
monitoring.analysis-workers=4

# Sliding Window Analysis Configuration (seconds)
analysis.window.seconds=5.0
analysis.debounce.ms=150
analysis.max-file-size-mb=25

# Shannon Entropy Thresholds (bits per byte, scale 0 to 8)
threshold.entropy.low=6.0
threshold.entropy.medium=7.0
threshold.entropy.high=7.5

# Modification Rate Thresholds (files per second)
threshold.rate.low=2.0
threshold.rate.medium=5.0
threshold.rate.high=15.0

# Number of Files Thresholds (within analysis window)
threshold.files.low=5
threshold.files.medium=20
threshold.files.high=100

# Affected Directories Thresholds
threshold.directories.medium=2
threshold.directories.high=3
threshold.directories.critical=5

# Threat Score Thresholds (scale 0 to 100)
threat.score.suspicious=30
threat.score.high=60
threat.score.critical=80

# Suspicious File Extensions (comma-separated lowercase)
suspicious.extensions=.encrypted,.locked,.crypto,.crypted,.ransom,.wncry,.locky,.cerber,.darkside,.revil,.blackcat

# Database Configuration
database.url=jdbc:sqlite:ransomshield.db
